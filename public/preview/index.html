function theme(){app.classList.toggle('gallery-light',light);document.documentElement.style.background=light?'#fff':'#050505';const b=document.querySelector('.gallery-theme');b.textContent=light?'◐':'◑';b.setAttribute('aria-pressed',String(light));b.setAttribute('aria-label',light?'切换为黑色背景':'切换为白色背景');}

const dialog=document.querySelector('dialog');let trigger;
