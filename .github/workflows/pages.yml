name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /portfolio
      - name: Prepare GitHub Pages artifact
        run: |
          rm -f dist/client/admin.html dist/client/admin.rsc
          mv dist/client/portfolio/_next dist/client/_next
          rmdir dist/client/portfolio
          for page in dist/client/projects/*.html; do
            slug="$(basename "$page" .html)"
            mkdir -p "dist/client/projects/$slug"
            mv "$page" "dist/client/projects/$slug/index.html"
          done
      - name: Publish approved homepage snapshot
        # Pin the approved preview so future preview edits do not change production.
        run: |
          git show ab41a2c9766ac9fde8df241c0078ada4b2ad1be4:public/preview/index.html > dist/client/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'dist/client/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace('<meta name="robots" content="noindex,nofollow">', '');
          html = html.replaceAll('独立交互预览', 'Visual Designer').replaceAll('独立预览', 'Zoey').replaceAll('新版框架预览', 'Visual Designer').replaceAll(' · 预览', '');
          fs.writeFileSync(file, html);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
